<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farhan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ff789a;
    --cream: #fff4e0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #ff789a; --cream: #fff4e0; }
  }
  :root[data-theme="dark"] { --bg: #ff789a; --cream: #fff4e0; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  main { width: 100%; max-width: 480px; padding: 24px; }
  .hidden { display: none !important; }

  #timer {
    font-size: clamp(72px, 22vw, 120px);
    font-weight: 600;
    line-height: 1;
    margin: 0 0 24px;
  }
  h1 {
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 28px;
  }
  #options { display: grid; gap: 12px; }
  button {
    font: inherit;
    font-size: 19px;
    color: var(--cream);
    background: transparent;
    border: 2.5px solid var(--cream);
    border-radius: 999px;
    padding: 14px 20px;
    cursor: pointer;
    transition: background .15s, color .15s, transform .15s;
  }
  button:hover, button:focus-visible { background: var(--cream); color: var(--bg); outline: none; }
  button:active { transform: scale(.97); }

  #done h1 { font-size: clamp(30px, 9vw, 44px); margin: 0; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<main>
  <section id="ask">
    <div id="timer" aria-live="polite">5</div>
    <h1>Kya aap mere Boyfriend banna chahenge? 🥺</h1>
    <div id="options" class="hidden">
      <button>YESSS</button>
      <button>Ofcourse, I love you.</button>
      <button>Aren't I already?</button>
      <button>All of the above.</button>
    </div>
  </section>
  <section id="done" class="hidden">
    <h1>🎉 Congratulations, you're officially Mr. Boyfren. 🎉</h1>
  </section>
</main>
<canvas id="confetti"></canvas>

<script>
  var timerEl = document.getElementById("timer");
  var optionsEl = document.getElementById("options");
  var left = 5;

  var tick = setInterval(function () {
    left -= 1;
    timerEl.textContent = left;
    if (left <= 0) {
      clearInterval(tick);
      timerEl.classList.add("hidden");
      optionsEl.classList.remove("hidden");
    }
  }, 1000);

  // Confetti
  var canvas = document.getElementById("confetti");
  var ctx = canvas.getContext("2d");
  var pieces = [];
  var colors = ["#fff4e0", "#ffffff", "#ffd1dc", "#ff3d6e", "#ffe08a"];
  var running = false;

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener("resize", resize);
  resize();

  function spawn(n) {
    for (var i = 0; i < n; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.5,
        size: 6 + Math.random() * 8,
        vy: 2 + Math.random() * 3,
        vx: -1.5 + Math.random() * 3,
        rot: Math.random() * 6.28,
        vr: -0.15 + Math.random() * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)],
        heart: Math.random() < 0.35
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.heart) {
        ctx.font = (p.size * 2) + "px serif";
        ctx.textAlign = "center";
        ctx.fillText("💗", 0, 0);
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      }
      ctx.restore();
    });
    pieces = pieces.filter(function (p) { return p.y < canvas.height + 30; });
    if (running || pieces.length) requestAnimationFrame(draw);
  }

  function celebrate() {
    running = true;
    spawn(160);
    var burst = setInterval(function () { spawn(30); }, 400);
    setTimeout(function () { clearInterval(burst); running = false; }, 6000);
    draw();
  }

  optionsEl.addEventListener("click", function (e) {
    if (e.target.tagName !== "BUTTON") return;
    document.getElementById("ask").classList.add("hidden");
    document.getElementById("done").classList.remove("hidden");
    celebrate();
  });
</script>
</body>
</html>
